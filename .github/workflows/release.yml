name: Release

on:
  push:
    tags: [ 'v[0-9]*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-26.04
    steps:
      - name: Check tag
        run: |
          # No pre-release suffixes: "1.1.0-rc.1" does not fit the B&W EXIT labels.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Install tools
        run: make install-tools

      - name: Run checks
        run: make check

      - name: Build
        run: make build VERSION="${GITHUB_REF_NAME#v}" ZIP_NAME="expresslrs-lua-$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without an explicit start tag GitHub may diff against the nightly prerelease.
          args=()
          if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            args+=(--notes-start-tag "$prev")
          fi
          notes=$(cat <<EOF
          | Radio | Download |
          |-------|----------|
          | EdgeTX 2.12.1+ or 3.0+ | \`expresslrs-lua-$GITHUB_REF_NAME.zip\` |
          | Older EdgeTX, OpenTX or low-RAM radios | \`expresslrs-lua-legacy.zip\` |

          Extract the zip onto the SD card root. The new scripts require ExpressLRS 3.5.4+; use the legacy zip for older modules.
          EOF
          )
          # --notes is placed before the generated notes.
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes \
            --latest \
            "${args[@]}"
